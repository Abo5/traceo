document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-weight: 700;\n  font-display: swap;\n  src: url(\"2273c086-2f3b-4cd4-a979-3a5a80e12847\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2bd069df-f7aa-4d58-b9da-d71e0a7754b6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ============================================================\n   FORGE — COLOR SYSTEM  (v2 — vibrant, dark-only)\n   Lively & colorful. Warm amber leads; a full spectrum of\n   vivid hues is used decoratively (categories, charts, tiles).\n   Neutral-cool dark base so the colors pop. No pure black.\n   ============================================================ */\n\n:root {\n  /* ---- Surfaces (neutral-cool dark, lets vivid colors sing) ---- */\n  --bg:            #131217;\n  --surface:       #1B1A21;\n  --surface-2:     #22212B;\n  --surface-3:     #2C2B37;\n  --overlay:       rgba(7, 7, 11, 0.66);\n\n  /* ---- Borders / dividers ---- */\n  --border:        #312F3C;\n  --border-strong: #443F54;\n\n  /* ---- Text ---- */\n  --text:          #F2EFF7;\n  --text-secondary:#ADA8BB;\n  --text-muted:    #756F84;\n  --text-inverse:  #1A1207;\n\n  /* ---- Brand accent (warm Amber) ---- */\n  --accent:            #FF9B3D;  /* links, active icons, focus, bright-on-dark */\n  --accent-press:      #F08A2A;\n  --accent-fill:       #FF8A22;  /* solid primary button bg */\n  --accent-fill-press: #F07A12;\n  --accent-fg:         #211405;  /* dark warm text on amber fill (AA) */\n  --accent-subtle:     rgba(255, 138, 34, 0.16);\n  --accent-ring:       rgba(255, 138, 34, 0.42);\n\n  /* ---- Vibrant category spectrum (decorative + data) ---- */\n  --c-amber:  #FF8A22;\n  --c-coral:  #FF5C72;\n  --c-pink:   #F85EC2;\n  --c-violet: #9B6BFF;\n  --c-blue:   #4D9DFF;\n  --c-cyan:   #2BD4C4;\n  --c-green:  #4FD86B;\n  --c-yellow: #FFC53D;\n\n  /* ---- Semantic ---- */\n  --success:        #3FD179;\n  --success-subtle: rgba(63, 209, 121, 0.16);\n  --warning:        #FFC53D;\n  --warning-subtle: rgba(255, 197, 61, 0.16);\n  --error:          #FF5C72;\n  --error-subtle:   rgba(255, 92, 114, 0.16);\n  --info:           var(--c-blue);\n  --info-subtle:    rgba(77, 157, 255, 0.16);\n\n  /* ---- Lively gradients ---- */\n  --grad-warm: linear-gradient(135deg, #FF8A22 0%, #FF5C72 100%); /* @kind color */\n  --grad-cool: linear-gradient(135deg, #9B6BFF 0%, #4D9DFF 100%); /* @kind color */\n  --grad-hero: linear-gradient(135deg, #FF8A22 0%, #F85EC2 52%, #9B6BFF 100%); /* @kind color */\n  --grad-mint: linear-gradient(135deg, #2BD4C4 0%, #4FD86B 100%); /* @kind color */\n\n  color-scheme: dark;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   FORGE — TYPOGRAPHY\n   Bilingual (Arabic + Latin) via IBM Plex Sans Arabic.\n   Mono via JetBrains Mono for technical metadata.\n   ============================================================ */\n\n:root {\n  --font-sans: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Sizes — tuned for mobile reading distance */\n  --fs-display:  34px;\n  --fs-h1:       28px;\n  --fs-h2:       22px;\n  --fs-h3:       18px;\n  --fs-subtitle: 16px;\n  --fs-body:     15px;\n  --fs-body-sm:  13px;\n  --fs-caption:  12px;\n  --fs-tiny:     11px;\n  --fs-button:   15px;\n\n  /* Weights */\n  --fw-light:    300; /* @kind font */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Line heights */\n  --lh-tight:    1.16; /* @kind font */\n  --lh-snug:     1.32; /* @kind font */\n  --lh-normal:   1.55; /* @kind font */\n\n  /* Letter spacing */\n  --ls-tight:   -0.02em; /* @kind font */\n  --ls-snug:    -0.01em; /* @kind font */\n  --ls-normal:   0;       /* @kind font */\n  --ls-wide:     0.06em;  /* @kind font */\n}\n\n/* Optional helper classes (components reference vars directly) */\n.t-display  { font-family: var(--font-sans); font-size: var(--fs-display);  font-weight: var(--fw-bold);     line-height: var(--lh-tight); letter-spacing: var(--ls-tight); }\n.t-h1       { font-family: var(--font-sans); font-size: var(--fs-h1);       font-weight: var(--fw-bold);     line-height: var(--lh-tight); letter-spacing: var(--ls-snug); }\n.t-h2       { font-family: var(--font-sans); font-size: var(--fs-h2);       font-weight: var(--fw-semibold); line-height: var(--lh-snug);  letter-spacing: var(--ls-snug); }\n.t-h3       { font-family: var(--font-sans); font-size: var(--fs-h3);       font-weight: var(--fw-semibold); line-height: var(--lh-snug); }\n.t-subtitle { font-family: var(--font-sans); font-size: var(--fs-subtitle); font-weight: var(--fw-medium);   line-height: var(--lh-snug); }\n.t-body     { font-family: var(--font-sans); font-size: var(--fs-body);     font-weight: var(--fw-regular);  line-height: var(--lh-normal); }\n.t-caption  { font-family: var(--font-sans); font-size: var(--fs-caption);  font-weight: var(--fw-medium);   line-height: var(--lh-snug); }\n.t-tiny     { font-family: var(--font-sans); font-size: var(--fs-tiny);     font-weight: var(--fw-semibold); letter-spacing: var(--ls-wide); text-transform: uppercase; }\n.t-mono     { font-family: var(--font-mono); font-size: var(--fs-body-sm);  font-weight: var(--fw-medium); }\n<\u002Fstyle>\n<style>/* ============================================================\n   FORGE — SPACING & LAYOUT\n   4px base grid. Generous rhythm for thumb comfort.\n   ============================================================ */\n\n:root {\n  --space-0:  0;\n  --space-1:  2px;\n  --space-2:  4px;\n  --space-3:  6px;\n  --space-4:  8px;\n  --space-5:  12px;\n  --space-6:  16px;\n  --space-7:  20px;\n  --space-8:  24px;\n  --space-9:  32px;\n  --space-10: 40px;\n  --space-11: 48px;\n  --space-12: 64px;\n\n  /* Layout rules */\n  --screen-pad:   20px;   /* outer horizontal margin on phone screens */\n  --section-gap:  28px;   /* vertical gap between major sections */\n  --card-pad:     16px;   /* internal padding of cards */\n  --stack-gap:    12px;   /* gap inside a stack of related items */\n\n  /* Touch targets */\n  --tap-min:      44px;   /* minimum hit area */\n  --tap-comfort:  52px;   /* primary buttons, nav items */\n\n  /* Component heights */\n  --field-h:      52px;\n  --button-h:     52px;\n  --button-h-sm:  40px;\n  --appbar-h:     56px;\n  --tabbar-h:     64px;\n\n  --content-max:  440px;  /* max readable width for phone-first layouts */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   FORGE — RADIUS & ELEVATION\n   Soft, structured. Cards lean on borders + low shadow,\n   not heavy drop-shadows (keeps the dark UI calm).\n   ============================================================ */\n\n:root {\n  /* Corner radius */\n  --r-xs:   6px;   /* chips, badges, small controls */\n  --r-sm:   8px;   /* buttons, inputs */\n  --r-md:   12px;  /* cards, list rows */\n  --r-lg:   16px;  /* sheets, large cards */\n  --r-xl:   22px;  /* bottom sheets, modals */\n  --r-pill: 999px; /* pills, avatars, FAB */\n\n  /* Elevation — soft + low. Dark mode keeps shadows subtle;\n     depth is mostly communicated by surface tint + border. */\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.30);\n  --shadow-md: 0 6px 18px rgba(0,0,0,0.34);\n  --shadow-lg: 0 16px 40px rgba(0,0,0,0.46);\n  --shadow-accent: 0 8px 24px rgba(255,138,34,0.36); /* FAB / primary lift */\n\n  /* Border widths */\n  --bw-hair: 1px;\n  --bw-emph: 1.5px;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   FORGE — MOTION\n   Calm, quick, deliberate. Nothing bounces or overshoots hard.\n   Respect prefers-reduced-motion in components.\n   ============================================================ */\n\n:root {\n  /* Durations */\n  --dur-fast:  120ms; /* @kind other */\n  --dur-base:  200ms; /* @kind other */\n  --dur-slow:  320ms; /* @kind other */\n\n  /* Easing */\n  --ease-standard:   cubic-bezier(0.2, 0.6, 0.2, 1);   /* @kind other */\n  --ease-emphasized: cubic-bezier(0.2, 0.85, 0.25, 1); /* @kind other */\n  --ease-exit:       cubic-bezier(0.4, 0.0, 1, 1);     /* @kind other */\n\n  /* Press scale used across tappables */\n  --press-scale: 0.97; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   FORGE — base resets + element defaults\n   Lightweight. Sets the default type + canvas for any page\n   that links the design system.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  font-weight: var(--fw-regular);\n  color: var(--text);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Better default wrapping for headings/paragraphs */\nh1, h2, h3, h4 { text-wrap: balance; }\np { text-wrap: pretty; }\n\n/* Selection */\n::selection { background: var(--accent-subtle); color: var(--text); }\n\n/* Focus-visible ring used by interactive components */\n:focus-visible {\n  outline: 2px solid var(--accent-ring);\n  outline-offset: 2px;\n}\n\na { color: var(--accent); text-decoration: none; }\n<\u002Fstyle>\n<style>/* ============================================================\n   FORGE DESIGN SYSTEM — globa ange: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2bd069df-f7aa-4d58-b9da-d71e0a7754b6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   FORGE — COLOR SYSTEM  (v2 — vibrant, dark-only)\n   Lively & colorful. Warm amber leads; a full spectrum of\n   vivid hues is used decoratively (categories, charts, tiles).\n   Neutral-cool dark base so the colors pop. No pure black.\n   ============================================================ */\n\n:root {\n  /* ---- Surfaces (neutral-cool dark, lets vivid colors sing) ---- */\n  --bg:            #131217;\n  --surface:       #1B1A21;\n  --surface-2:     #22212B;\n  --surface-3:     #2C2B37;\n  --overlay:       rgba(7, 7, 11, 0.66);\n\n  /* ---- Borders / dividers ---- */\n  --border:        #312F3C;\n  --border-strong: #443F54;\n\n  /* ---- Text ---- */\n  --text:          #F2EFF7;\n  --text-secondary:#ADA8BB;\n  --text-muted:    #756F84;\n  --text-inverse:  #1A1207;\n\n  /* ---- Brand accent (warm Amber) ---- */\n  --accent:            #FF9B3D;  /* links, active icons, focus, bright-on-dark */\n  --accent-press:      #F08A2A;\n  --accent-fill:       #FF8A22;  /* solid primary button bg */\n  --accent-fill-press: #F07A12;\n  --accent-fg:         #211405;  /* dark warm text on amber fill (AA) */\n  --accent-subtle:     rgba(255, 138, 34, 0.16);\n  --accent-ring:       rgba(255, 138, 34, 0.42);\n\n  /* ---- Vibrant category spectrum (decorative + data) ---- */\n  --c-amber:  #FF8A22;\n  --c-coral:  #FF5C72;\n  --c-pink:   #F85EC2;\n  --c-violet: #9B6BFF;\n  --c-blue:   #4D9DFF;\n  --c-cyan:   #2BD4C4;\n  --c-green:  #4FD86B;\n  --c-yellow: #FFC53D;\n\n  /* ---- Semantic ---- */\n  --success:        #3FD179;\n  --success-subtle: rgba(63, 209, 121, 0.16);\n  --warning:        #FFC53D;\n  --warning-subtle: rgba(255, 197, 61, 0.16);\n  --error:          #FF5C72;\n  --error-subtle:   rgba(255, 92, 114, 0.16);\n  --info:           var(--c-blue);\n  --info-subtle:    rgba(77, 157, 255, 0.16);\n\n  /* ---- Lively gradients ---- */\n  --grad-warm: linear-gradient(135deg, #FF8A22 0%, #FF5C72 100%); /* @kind color */\n  --grad-cool: linear-gradient(135deg, #9B6BFF 0%, #4D9DFF 100%); /* @kind color */\n  --grad-hero: linear-gradient(135deg, #FF8A22 0%, #F85EC2 52%, #9B6BFF 100%); /* @kind color */\n  --grad-mint: linear-gradient(135deg, #2BD4C4 0%, #4FD86B 100%); /* @kind color */\n\n  color-scheme: dark;\n}\n\n/* ============================================================\n   FORGE — TYPOGRAPHY\n   Bilingual (Arabic + Latin) via IBM Plex Sans Arabic.\n   Mono via JetBrains Mono for technical metadata.\n   ============================================================ */\n\n:root {\n  --font-sans: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Sizes — tuned for mobile reading distance */\n  --fs-display:  34px;\n  --fs-h1:       28px;\n  --fs-h2:       22px;\n  --fs-h3:       18px;\n  --fs-subtitle: 16px;\n  --fs-body:     15px;\n  --fs-body-sm:  13px;\n  --fs-caption:  12px;\n  --fs-tiny:     11px;\n  --fs-button:   15px;\n\n  /* Weights */\n  --fw-light:    300; /* @kind font */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Line heights */\n  --lh-tight:    1.16; /* @kind font */\n  --lh-snug:     1.32; /* @kind font */\n  --lh-normal:   1.55; /* @kind font */\n\n  /* Letter spacing */\n  --ls-tight:   -0.02em; /* @kind font */\n  --ls-snug:    -0.01em; /* @kind font */\n  --ls-normal:   0;       /* @kind font */\n  --ls-wide:     0.06em;  /* @kind font */\n}\n\n/* Optional helper classes (components reference vars directly) */\n.t-display  { font-family: var(--font-sans); font-size: var(--fs-display);  font-weight: var(--fw-bold);     line-height: var(--lh-tight); letter-spacing: var(--ls-tight); }\n.t-h1       { font-family: var(--font-sans); font-size: var(--fs-h1);       font-weight: var(--fw-bold);     line-height: var(--lh-tight); letter-spacing: var(--ls-snug); }\n.t-h2       { font-family: var(--font-sans); font-size: var(--fs-h2);       font-weight: var(--fw-semibold); line-height: var(--lh-snug);  letter-spacing: var(--ls-snug); }\n.t-h3       { font-family: var(--font-sans); font-size: var(--fs-h3);       font-weight: var(--fw-semibold); line-height: var(--lh-snug); }\n.t-subtitle { font-family: var(--font-sans); font-size: var(--fs-subtitle); font-weight: var(--fw-medium);   line-height: var(--lh-snug); }\n.t-body     { font-family: var(--font-sans); font-size: var(--fs-body);     font-weight: var(--fw-regular);  line-height: var(--lh-normal); }\n.t-caption  { font-family: var(--font-sans); font-size: var(--fs-caption);  font-weight: var(--fw-medium);   line-height: var(--lh-snug); }\n.t-tiny     { font-family: var(--font-sans); font-size: var(--fs-tiny);     font-weight: var(--fw-semibold); letter-spacing: var(--ls-wide); text-transform: uppercase; }\n.t-mono     { font-family: var(--font-mono); font-size: var(--fs-body-sm);  font-weight: var(--fw-medium); }\n\n/* ============================================================\n   FORGE — SPACING & LAYOUT\n   4px base grid. Generous rhythm for thumb comfort.\n   ============================================================ */\n\n:root {\n  --space-0:  0;\n  --space-1:  2px;\n  --space-2:  4px;\n  --space-3:  6px;\n  --space-4:  8px;\n  --space-5:  12px;\n  --space-6:  16px;\n  --space-7:  20px;\n  --space-8:  24px;\n  --space-9:  32px;\n  --space-10: 40px;\n  --space-11: 48px;\n  --space-12: 64px;\n\n  /* Layout rules */\n  --screen-pad:   20px;   /* outer horizontal margin on phone screens */\n  --section-gap:  28px;   /* vertical gap between major sections */\n  --card-pad:     16px;   /* internal padding of cards */\n  --stack-gap:    12px;   /* gap inside a stack of related items */\n\n  /* Touch targets */\n  --tap-min:      44px;   /* minimum hit area */\n  --tap-comfort:  52px;   /* primary buttons, nav items */\n\n  /* Component heights */\n  --field-h:      52px;\n  --button-h:     52px;\n  --button-h-sm:  40px;\n  --appbar-h:     56px;\n  --tabbar-h:     64px;\n\n  --content-max:  440px;  /* max readable width for phone-first layouts */\n}\n\n/* ============================================================\n   FORGE — RADIUS & ELEVATION\n   Soft, structured. Cards lean on borders + low shadow,\n   not heavy drop-shadows (keeps the dark UI calm).\n   ============================================================ */\n\n:root {\n  /* Corner radius */\n  --r-xs:   6px;   /* chips, badges, small controls */\n  --r-sm:   8px;   /* buttons, inputs */\n  --r-md:   12px;  /* cards, list rows */\n  --r-lg:   16px;  /* sheets, large cards */\n  --r-xl:   22px;  /* bottom sheets, modals */\n  --r-pill: 999px; /* pills, avatars, FAB */\n\n  /* Elevation — soft + low. Dark mode keeps shadows subtle;\n     depth is mostly communicated by surface tint + border. */\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.30);\n  --shadow-md: 0 6px 18px rgba(0,0,0,0.34);\n  --shadow-lg: 0 16px 40px rgba(0,0,0,0.46);\n  --shadow-accent: 0 8px 24px rgba(255,138,34,0.36); /* FAB / primary lift */\n\n  /* Border widths */\n  --bw-hair: 1px;\n  --bw-emph: 1.5px;\n}\n\n/* ============================================================\n   FORGE — MOTION\n   Calm, quick, deliberate. Nothing bounces or overshoots hard.\n   Respect prefers-reduced-motion in components.\n   ============================================================ */\n\n:root {\n  /* Durations */\n  --dur-fast:  120ms; /* @kind other */\n  --dur-base:  200ms; /* @kind other */\n  --dur-slow:  320ms; /* @kind other */\n\n  /* Easing */\n  --ease-standard:   cubic-bezier(0.2, 0.6, 0.2, 1);   /* @kind other */\n  --ease-emphasized: cubic-bezier(0.2, 0.85, 0.25, 1); /* @kind other */\n  --ease-exit:       cubic-bezier(0.4, 0.0, 1, 1);     /* @kind other */\n\n  /* Press scale used across tappables */\n  --press-scale: 0.97; /* @kind other */\n}\n\n/* ============================================================\n   FORGE — base resets + element defaults\n   Lightweight. Sets the default type + canvas for any page\n   that links the design system.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  font-weight: var(--fw-regular);\n  color: var(--text);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Better default wrapping for headings/paragraphs */\nh1, h2, h3, h4 { text-wrap: balance; }\np { text-wrap: pretty; }\n\n/* Selection */\n::selection { background: var(--accent-subtle); color: var(--text); }\n\n/* Focus-visible ring used by interactive components */\n:focus-visible {\n  outline: 2px solid var(--accent-ring);\n  outline-offset: 2px;\n}\n\na { color: var(--accent); text-decoration: none; }\n\n<\u002Fstyle>\n<script src=\"c06b2c88-7749-4aad-903c-03f671d2ca14\"><\u002Fscript>\n<style>\n  body { margin: 0; background: var(--bg); }\n  a { color: var(--accent); text-decoration: none; }\n  a:hover { color: #FFB268; }\n  ::selection { background: var(--accent-subtle); }\n  @keyframes traceo-dash { to { stroke-dashoffset: -24; } }\n  @keyframes traceo-pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.55\">\n\n  <header style=\"position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 32px;height:64px;background:rgba(19,18,23,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <div style=\"width:30px;height:30px;border-radius:9px;background:var(--grad-hero);display:flex;align-items:center;justify-content:center;color:#1A1207;font-weight:700;font-size:14px\">T<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:10px\">\n        <span style=\"font-weight:700;font-size:17px;letter-spacing:-0.02em\">Traceo<\u002Fspan>\n        <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--text-muted)\">requirement → test → result<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex;align-items:center;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"3\">\n        <button type=\"button\" sc-camel-on-click=\"{{ item.go }}\" style=\"border:none;cursor:pointer;font-family:var(--font-sans);font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;background:{{ item.bg }};color:{{ item.fg }};transition:background var(--dur-fast) var(--ease-standard)\">{{ item.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span style=\"font-size:13px;color:var(--text-secondary)\">Docs<\u002Fspan>\n      <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Button\" size=\"sm\" hint-size=\"auto,40px\">Book a demo<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ OVERVIEW ============ -->\n  <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n    <section style=\"padding:80px 32px 64px;max-width:1240px;margin:0 auto\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:28px;max-width:760px\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--border);border-radius:999px;width:fit-content;font-size:12px;color:var(--text-secondary)\">\n          <span style=\"width:6px;height:6px;border-radius:50%;background:var(--success)\"><\u002Fspan>\n          Built for Saudi software houses — Arabic requirements, RTL, on-premise\n        <\u002Fdiv>\n        <h1 style=\"margin:0;font-size:56px;line-height:1.06;letter-spacing:-0.03em;font-weight:700;text-wrap:pretty\">Every requirement, traced to a test that actually ran.<\u002Fh1>\n        <p style=\"margin:0;font-size:18px;line-height:1.6;color:var(--text-secondary);max-width:620px;text-wrap:pretty\">Drop in a URL and your requirements document. Traceo discovers the real API surface, generates test cases bound to each acceptance criterion, runs them, and reports what passed, what broke, and what nobody ever covered.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n          <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Button\" sc-camel-on-click=\"{{ goNewRun }}\" hint-size=\"auto,52px\">Start a run<\u002Fx-import>\n          <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ goReport }}\" hint-size=\"auto,52px\">See a sample report<\u002Fx-import>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-muted)\">no card · 50 test cases free<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- pipeline diagram -->\n      <div style=\"margin-top:56px;border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)\">\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)\">The pipeline<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--text-muted)\">run #1042 · 6m 12s<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:stretch;gap:0;padding:28px 20px 32px\">\n          <sc-for list=\"{{ pipeline }}\" as=\"step\" hint-placeholder-count=\"5\">\n            <div style=\"position:relative;display:flex;flex-direction:column;gap:12px;padding:0 16px;border-left:1px solid var(--border)\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <div style=\"width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600;background:{{ step.tint }};color:{{ step.color }}\">{{ step.n }}<\u002Fdiv>\n                <div style=\"height:1px;flex:1;background:var(--border)\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">{{ step.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:var(--text-secondary);line-height:1.5\">{{ step.body }}<\u002Fdiv>\n              <div style=\"margin-top:4px;font-family:var(--font-mono);font-size:11px;color:{{ step.color }}\">{{ step.out }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- problem -->\n    <section style=\"border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:56px 32px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:64px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)\">The problem<\u002Fspan>\n          <h2 style=\"margin:0;font-size:32px;line-height:1.15;letter-spacing:-0.02em;font-weight:700\">Writing test cases eats 40–60% of QA time — and the trace is lost anyway.<\u002Fh2>\n          <p style=\"margin:0;color:var(--text-secondary);text-wrap:pretty\">When a requirement changes, nobody can say which test cases just went stale. Coverage becomes a spreadsheet nobody trusts.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px\">\n          <sc-for list=\"{{ problemStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"padding:22px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)\">\n              <div style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:{{ s.color }}\">{{ s.value }}<\u002Fdiv>\n              <div style=\"margin-top:6px;font-size:13px;color:var(--text-secondary);line-height:1.5\">{{ s.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- how it works — accordion -->\n    <section style=\"max-width:1240px;margin:0 auto;padding:72px 32px\">\n      <div style=\"display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px\">\n        <div>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)\">How it works<\u002Fspan>\n          <h2 style=\"margin:8px 0 0;font-size:30px;letter-spacing:-0.02em;font-weight:700\">Five layers, no magic<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:420px;font-size:14px;color:var(--text-secondary)\">The generator only ever writes tests against endpoints that were actually discovered. Nothing hallucinated reaches your suite.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ layers }}\" as=\"l\" hint-placeholder-count=\"5\">\n          <div style=\"border:1px solid {{ l.border }};border-radius:12px;background:var(--surface);overflow:hidden;transition:border-color var(--dur-fast) var(--ease-standard)\">\n            <button type=\"button\" sc-camel-on-click=\"{{ l.toggle }}\" style=\"width:100%;display:flex;align-items:center;gap:16px;padding:18px 20px;background:transparent;border:none;cursor:pointer;text-align:left;font-family:var(--font-sans);color:var(--text)\">\n              <span style=\"font-family:var(--font-mono);font-size:12px;color:{{ l.color }};width:22px\">{{ l.n }}<\u002Fspan>\n              <span style=\"flex:1;font-size:16px;font-weight:600;letter-spacing:-0.01em\">{{ l.title }}<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--text-muted)\">{{ l.tag }}<\u002Fspan>\n              <span style=\"font-size:18px;color:var(--text-muted);transform:{{ l.caret }};transition:transform var(--dur-fast) var(--ease-standard)\">›<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ l.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 20px 20px 58px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:32px;align-items:start\">\n                <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--text-secondary);font-size:14px\">\n                  <sc-for list=\"{{ l.points }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <li>{{ p }}<\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n                <div style=\"padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap\">{{ l.code }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- traceability visual -->\n    <section style=\"border-top:1px solid var(--border);background:var(--surface)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:72px 32px\">\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)\">Traceability<\u002Fspan>\n        <h2 style=\"margin:8px 0 28px;font-size:30px;letter-spacing:-0.02em;font-weight:700\">One matrix. Requirement, tests, verdict.<\u002Fh2>\n        <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface-2);overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,2.2fr) 110px 110px 120px 1fr;gap:0;padding:12px 20px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)\">\n            <span>Requirement<\u002Fspan><span>Tests<\u002Fspan><span>Passed<\u002Fspan><span>Failed<\u002Fspan><span>Coverage<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ matrix }}\" as=\"row\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,2.2fr) 110px 110px 120px 1fr;gap:0;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)\" style-hover=\"background:var(--surface-3)\">\n              <div style=\"display:flex;align-items:center;gap:12px;min-width:0\">\n                <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--accent)\">{{ row.id }}<\u002Fspan>\n                <span style=\"font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ row.title }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-family:var(--font-mono);font-size:13px;color:var(--text-secondary)\">{{ row.tests }}<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-size:13px;color:var(--success)\">{{ row.passed }}<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-size:13px;color:{{ row.failColor }}\">{{ row.failed }}<\u002Fspan>\n              <div style=\"display:flex;align-items:center;gap:12px\">\n                <div style=\"flex:1;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;max-width:220px\">\n                  <div style=\"height:100%;width:{{ row.pct }};background:{{ row.barColor }};border-radius:999px\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-muted);width:42px\">{{ row.pct }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:16px 0 0;font-size:13px;color:var(--text-muted)\">Rows with zero tests are coverage gaps — the fastest thing to show a project manager.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- pricing -->\n    <section style=\"max-width:1240px;margin:0 auto;padding:72px 32px\">\n      <div style=\"margin-bottom:28px\">\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)\">Pricing<\u002Fspan>\n        <h2 style=\"margin:8px 0 0;font-size:30px;letter-spacing:-0.02em;font-weight:700\">Per team, in SAR<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:stretch\">\n        <sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;padding:24px;border:1px solid {{ t.border }};border-radius:14px;background:{{ t.bg }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <span style=\"font-size:16px;font-weight:600\">{{ t.name }}<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-size:11px;color:{{ t.color }}\">{{ t.for }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:6px\">\n              <span style=\"font-size:30px;font-weight:700;letter-spacing:-0.02em\">{{ t.price }}<\u002Fspan>\n              <span style=\"font-size:13px;color:var(--text-muted)\">{{ t.unit }}<\u002Fspan>\n            <\u002Fdiv>\n            <ul style=\"margin:0;padding-left:16px;display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--text-secondary);flex:1\">\n              <sc-for list=\"{{ t.features }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <li>{{ f }}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n            <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Button\" variant=\"{{ t.cta }}\" size=\"sm\" full-width=\"{{ true }}\" hint-size=\"100%,40px\">{{ t.ctaLabel }}<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border);background:var(--surface)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:64px 32px;display:flex;align-items:center;justify-content:space-between;gap:40px;flex-wrap:wrap\">\n        <div style=\"max-width:560px\">\n          <h2 style=\"margin:0 0 10px;font-size:28px;letter-spacing:-0.02em;font-weight:700\">Bring one requirements document to the demo.<\u002Fh2>\n          <p style=\"margin:0;color:var(--text-secondary)\">45 minutes, your document, your staging URL. You leave with a traceability matrix you can send to the client.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px\">\n          <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Button\" hint-size=\"auto,52px\">Book a demo<\u002Fx-import>\n          <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Button\" variant=\"secondary\" hint-size=\"auto,52px\">Talk to an engineer<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ NEW RUN ============ -->\n  <sc-if value=\"{{ isNewRun }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1240px;margin:0 auto;padding:40px 32px 80px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <div>\n        <h1 style=\"margin:0 0 6px;font-size:26px;letter-spacing:-0.02em;font-weight:700\">New run<\u002Fh1>\n        <p style=\"margin:0;font-size:14px;color:var(--text-secondary)\">Point Traceo at the system under test and give it the requirements it must prove.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--accent)\">01<\u002Fspan>\n          <span style=\"font-size:16px;font-weight:600\">Target<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px\">\n          <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Input\" label=\"Base URL\" value=\"{{ url }}\" sc-camel-on-change=\"{{ setUrl }}\" placeholder=\"https://staging.example.sa/api\" hint-size=\"100%,72px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Input\" label=\"Environment\" value=\"staging\" hint-size=\"100%,72px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <span styl on:transform var(--dur-fast) var(--ease-standard)\">›<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ b.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:4px 20px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px\">\n                <div style=\"display:flex;flex-direction:column;gap:10px\">\n                  <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)\">Steps to reproduce<\u002Fspan>\n                  <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-secondary)\">\n                    <sc-for list=\"{{ b.steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n                      <li>{{ s }}<\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Fol>\n                  <div style=\"margin-top:6px;display:flex;gap:8px;flex-wrap:wrap\">\n                    <sc-for list=\"{{ b.tags }}\" as=\"tg\" hint-placeholder-count=\"2\">\n                      <span style=\"font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:6px;background:var(--surface-3);color:var(--text-secondary)\">{{ tg }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:10px\">\n                  <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)\">Evidence<\u002Fspan>\n                  <div style=\"padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-family:var(--font-mono);font-size:12px;line-height:1.7;color:var(--text-secondary);white-space:pre-wrap\">{{ b.evidence }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:10px\">\n                    <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Button\" variant=\"secondary\" size=\"sm\" hint-size=\"auto,40px\">Open in Jira<\u002Fx-import>\n                    <x-import component-from-global-scope=\"ForgeDesignSystem_2bfd11.Button\" variant=\"ghost\" size=\"sm\" hint-size=\"auto,40px\">View request log<\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabMatrix }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,2.2fr) 110px 110px 120px 1fr;padding:12px 20px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)\">\n          <span>Requirement<\u002Fspan><span>Tests<\u002Fspan><span>Passed<\u002Fspan><span>Failed<\u002Fspan><span>Coverage<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ matrix }}\" as=\"row\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,2.2fr) 110px 110px 120px 1fr;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)\" style-hover=\"background:var(--surface-2)\">\n            <div style=\"display:flex;align-items:center;gap:12px;min-width:0\">\n              <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--accent)\">{{ row.id }}<\u002Fspan>\n              <span style=\"font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ row.title }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:var(--font-mono);font-size:13px;color:var(--text-secondary)\">{{ row.tests }}<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:13px;color:var(--success)\">{{ row.passed }}<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:13px;color:{{ row.failColor }}\">{{ row.failed }}<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <div style=\"flex:1;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;max-width:220px\">\n                <div style=\"height:100%;width:{{ row.pct }};background:{{ row.barColor }};border-radius:999px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-muted);width:42px\">{{ row.pct }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabGaps }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\n        <sc-for list=\"{{ gaps }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"padding:20px;border:1px solid var(--border);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--warning)\">{{ g.id }}<\u002Fspan>\n              <span style=\"font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--warning-subtle);color:var(--warning)\">no coverage<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">{{ g.title }}<\u002Fspan>\n            <span style=\"font-size:13px;color:var(--text-secondary)\">{{ g.why }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top:1px solid var(--border);padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;font-size:12px;color:var(--text-muted)\">\n    <span>Traceo · Riyadh<\u002Fspan>\n    <span style=\"font-family:var(--font-mono)\">on-premise available · data stays in the Kingdom<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { screen: 'overview', tab: 'failures', layer: 1, bug: 0, mode: 'auto', rules: [true, true, true, false], url: 'https://staging.northwind.sa/api/v2' };\n\n  set(k, v) { this.setState({ [k]: v }); }\n\n  renderVals() {\n    const s = this.state;\n    const screen = s.screen;\n    const navItems = [\n      ['overview', 'Overview'], ['newrun', 'New run'], ['report', 'Report']\n    ].map(([k, label]) => ({\n      label, go: () => this.set('screen', k),\n      bg: screen === k ? 'var(--accent-fill)' : 'transparent',\n      fg: screen === k ? 'var(--accent-fg)' : 'var(--text-secondary)'\n    }));\n\n    const pipeline = [\n      { n: '01', title: 'Requirements parser', body: 'PDF, DOCX, Markdown or Confluence in — Arabic or English.', out: 'requirement_id + criteria', color: 'var(--c-amber)', tint: 'rgba(255,138,34,.16)' },\n      { n: '02', title: 'Discovery engine', body: 'OpenAPI when it exists; otherwise real network traffic and DOM crawl.', out: 'endpoint map', color: 'var(--c-pink)', tint: 'rgba(248,94,194,.16)' },\n      { n: '03', title: 'Test generator', body: 'Boundary values, equivalence classes, decision tables — bound to criteria.', out: '218 test cases', color: 'var(--c-violet)', tint: 'rgba(155,107,255,.16)' },\n      { n: '04', title: 'Execution engine', body: 'HTTP runner with schema and business-logic assertions. Session reuse.', out: 'pass / fail per case', color: 'var(--c-blue)', tint: 'rgba(77,157,255,.16)' },\n      { n: '05', title: 'Report', body: 'Traceability matrix, coverage gaps, reproducible bug reports.', out: 'Jira / Xray export', color: 'var(--c-cyan)', tint: 'rgba(43,212,196,.16)' }\n    ];\n\n    const problemStats = [\n      { value: '40–60%', label: 'of QA time spent writing and maintaining test cases', color: 'var(--c-amber)' },\n      { value: '0', label: 'teams with a traceability matrix they trust after month three', color: 'var(--c-coral)' },\n      { value: '6m', label: 'typical time to notice a requirement change broke its tests', color: 'var(--c-violet)' }\n    ];\n\n    const layerData = [\n      { n: '01', title: 'Requirements parser', tag: 'ar + en', color: 'var(--c-amber)',\n        points: ['Extracts requirement_id, description, acceptance criteria, priority and type.', 'Handles Arabic RFPs and BRDs — the format most global tools choke on.', 'Every downstream artefact keeps a link back to its source paragraph.'],\n        code: 'REQ-014\\n  type: functional\\n  priority: high\\n  criteria:\\n    - رقم الجوال يبدأ بـ 05\\n    - 10 digits, numeric only' },\n      { n: '02', title: 'Discovery engine', tag: 'the hard part', color: 'var(--c-pink)',\n        points: ['With OpenAPI or Swagger: endpoints are read directly.', 'Without it: Playwright drives the app and the API map is built from observed traffic.', 'DOM crawl collects forms, inputs, buttons and client-side validations.'],\n        code: 'discovered 38 endpoints\\n  POST /auth/login        seen 4×\\n  GET  /orders            seen 12×\\n  POST /orders            seen 3×\\n  PATCH /orders/{id}      seen 2×' },\n      { n: '03', title: 'Test generator', tag: 'constrained LLM', color: 'var(--c-violet)',\n        points: ['Only generates against endpoints that discovery actually found.', 'Applies equivalence partitioning, boundary value analysis and decision tables.', 'Output is schema-validated before a single request is sent.'],\n        code: 'TC-102  REQ-014  boundary\\n  phone = \"05000000000\" (11)\\n  expect 422\\n  assert body.errors[0].field == \"phone\"' },\n      { n: '04', title: 'Execution engine', tag: 'api first', color: 'var(--c-blue)',\n        points: ['Assertions on status code, response schema, response time and business rules.', 'Auth once, session reused across the suite; test data set up and torn down per run.', 'Each run is isolated in its own container.'],\n        code: 'run #1042\\n  218 cases · 6m 12s\\n  concurrency 8\\n  p95 latency 412ms' },\n      { n: '05', title: 'Reporting & traceability', tag: 'the deliverable', color: 'var(--c-cyan)',\n        points: ['Matrix: requirement → test cases → verdict, always current.', 'Coverage gaps surface requirements with zero tests.', 'Bug reports carry repro steps, request log and response body. Export to Jira or Xray.'],\n        code: 'coverage 86%\\n  uncovered: REQ-021, REQ-033\\n  export → Jira (XRAY-4412)' }\n    ];\n    const layers = layerData.map((l, i) => ({\n      ...l, open: s.layer === i,\n      toggle: () => this.set('layer', s.layer === i ? -1 : i),\n      caret: s.layer === i ? 'rotate(90deg)' : 'rotate(0deg)',\n      border: s.layer === i ? 'var(--border-strong)' : 'var(--border)'\n    }));\n\n    const raw = [\n      ['REQ-008', 'User can sign in with national ID', 14, 14, 0],\n      ['REQ-014', 'Mobile number validation (05 prefix, 10 digits)', 11, 9, 2],\n      ['REQ-019', 'Order can be cancelled before dispatch', 9, 6, 3],\n      ['REQ-021', 'Arabic invoice renders right-to-left', 0, 0, 0],\n      ['REQ-027', 'Payment retries on gateway timeout', 7, 5, 2],\n      ['REQ-033', 'Audit log retained for 90 days', 0, 0, 0]\n    ];\n    const matrix = raw.map(([id, title, tests, passed, failed]) => {\n      const pct = tests ? Math.round((passed / tests) * 100) : 0;\n      return { id, title, tests: tests || '—', passed: passed || '—', failed: failed || '—',\n        failColor: failed ? 'var(--error)' : 'var(--text-muted)',\n        pct: pct + '%',\n        barColor: tests === 0 ? 'var(--warning)' : pct === 100 ? 'var(--success)' : 'var(--grad-warm)' };\n    });\n\n    const tiers = [\n      { name: 'Free', for: 'trial', price: '0', unit: 'SAR', color: 'var(--text-muted)', border: 'var(--border)', bg: 'var(--surface)', cta: 'secondary', ctaLabel: 'Start free',\n        features: ['1 project', '50 test cases', 'API testing only'] },\n      { name: 'Pro', for: 'small team', price: '149', unit: 'SAR / user / mo', color: 'var(--c-blue)', border: 'var(--border)', bg: 'var(--surface)', cta: 'secondary', ctaLabel: 'Choose Pro',\n        features: ['5 projects', 'Unlimited test cases', 'Traceability matrix', 'Email support'] },\n      { name: 'Team', for: 'software house', price: '2,400', unit: 'SAR / mo', color: 'var(--accent)', border: 'var(--accent)', bg: 'rgba(255,138,34,.06)', cta: 'primary', ctaLabel: 'Book a demo',\n        features: ['Unlimited projects', 'CI/CD + Jira integration', 'UI functional testing', 'Shared run history'] },\n      { name: 'Enterprise', for: 'government', price: 'Custom', unit: '', color: 'var(--c-violet)', border: 'var(--border)', bg: 'var(--surface)', cta: 'secondary', ctaLabel: 'Contact us',\n        features: ['On-premise deployment', 'SLA + onboarding', 'Team training', 'Arabic-first support'] }\n    ];\n\n    const modes = [['auto', 'Auto — traffic capture'], ['openapi', 'OpenAPI / Swagger'], ['postman', 'Postman collection']];\n    const discoveryModes = modes.map(([k, label]) => ({\n      label, pick: () => this.set('mode', k),\n      bg: s.mode === k ? 'var(--accent-subtle)' : 'transparent',\n      fg: s.mode === k ? 'var(--accent)' : 'var(--text-secondary)',\n      border: s.mode === k ? 'var(--accent)' : 'var(--border)'\n    }));\n    const hints = {\n      auto: 'Playwright drives the app and the endpoint map is built from observed network traffic.',\n      openapi: 'Fastest and most precise. Traceo reads paths, params and schemas directly.',\n      postman: 'Existing collection is imported and treated as the discovered surface.'\n    };\n\n    const ruleData = [\n      ['Boundary value analysis', 'Min, max, and one past each edge'],\n      ['Equivalence partitioning', 'One representative per valid/invalid class'],\n      ['Negative & auth cases', 'Missing token, wrong role, malformed body'],\n      ['RTL / localisation checks', 'Arabic payloads and right-to-left rendering']\n    ];\n    const rules = ruleData.map(([name, desc], i) => ({\n      name, desc,\n      toggle: () => { const r = s.rules.slice(); r[i] = !r[i]; this.set('rules', r); },\n      box: s.rules[i] ? 'var(--accent-fill)' : 'transparent',\n      boxBorder: s.rules[i] ? 'var(--accent-fill)' : 'var(--border-strong)',\n      border: s.rules[i] ? 'var(--accent)' : 'var(--border)',\n      bg: s.rules[i] ? 'rgba(255,138,34,.06)' : 'var(--surface-2)'\n    }));\n\n    const files = [\n      { type: 'DOCX', name: 'كراسة الشروط — منصة الطلبات v3.docx', reqs: '41 reqs', status: 'parsed', tone: 'success' },\n      { type: 'PDF', name: 'Northwind_BRD_addendum.pdf', reqs: '7 reqs', status: 'parsing', tone: 'warning' }\n    ];\n\n    const summary = [\n      { k: 'Requirements', v: '48', color: 'var(--text)' },\n      { k: 'Endpoints discovered', v: '38', color: 'var(--text)' },\n      { k: 'Estimated cases', v: '~218', color: 'var(--accent)' },\n      { k: 'Estimated duration', v: '6–8 min', color: 'var(--text-secondary)' }\n    ];\n\n    const tabList = [['failures', 'Failures (7)'], ['matrix', 'Traceability'], ['gaps', 'Coverage gaps (2)']];\n    const tabs = tabList.map(([k, label]) => ({\n      label, go: () => this.set('tab', k),\n      bg: s.tab === k ? 'var(--surface-3)' : 'transparent',\n      fg: s.tab === k ? 'var(--text)' : 'var(--text-secondary)'\n    }));\n\n    const kpis = [\n      { value: '218', label: 'cases run', color: 'var(--text)' },\n      { value: '211', label: 'passed', color: 'var(--success)' },\n      { value: '7', label: 'failed', color: 'var(--error)' },\n      { value: '86%', label: 'requirement coverage', color: 'var(--accent)' },\n      { value: '2', label: 'requirements with no test', color: 'var(--warning)' }\n    ];\n\n    const bugData = [\n      { id: 'BUG-141', title: 'Phone with 11 digits accepted — returns 201 instead of 422', req: 'REQ-014', severity: 'critical',\n        steps: ['POST /customers with phone \"05000000000\" (11 digits).', 'Observe response status 201 and a created record.', 'Expected 422 with errors[0].field == \"phone\".'],\n        tags: ['POST /customers', 'boundary', 'TC-102'],\n        evidence: 'status: 201 Created  (expected 422)\\nlatency: 188ms\\nbody: { \"id\": 9182, \"phone\": \"05000000000\" }\\nassert failed: schema.errors expected non-empty' },\n      { id: 'BUG-142', title: 'Cancelling a dispatched order still succeeds', req: 'REQ-019', severity: 'critical',\n        steps: ['Create an order and move it to state \"dispatched\".', 'PATCH /orders/{id} with { \"status\": \"cancelled\" }.', 'Expected 409 conflict; got 200 and the order was cancelled.'],\n        tags: ['PATCH /orders/{id}', 'decision table', 'TC-155'],\n        evidence: 'status: 200 OK  (expected 409)\\nbody.status: \"cancelled\"\\nbusiness rule: dispatched → cancelled is not allowed' },\n      { id: 'BUG-143', title: 'Gateway timeout is not retried — order left in pending', req: 'REQ-027', severity: 'major',\n        steps: ['Force the payment gateway stub to time out after 30s.', 'POST /payments once.', 'Expected 2 retry attempts; observed 0, order stuck in \"pending\".'],\n        tags: ['POST /payments', 'negative', 'TC-198'],\n        evidence: 'attempts: 1  (expected 3)\\nstatus: 504 Gateway Timeout\\norder.status: \"pending\" after 60s' },\n      { id: 'BUG-144', title: 'Arabic customer name returned mojibake in invoice payload', req: 'REQ-021', severity: 'major',\n        steps: ['Create a customer named \"محمد الشمري\".', 'GET /invoices/{id}.', 'Name comes back as \"Ù…Ø­Ù…Ø¯\" — encoding lost.'],\n        tags: ['GET /invoices/{id}', 'localisation', 'TC-211'],\n        evidence: 'content-type: application/json (no charset)\\nexpected: \"محمد الشمري\"\\nactual:   \"Ù…Ø­Ù…Ø¯ Ø§Ù„Ø´Ù…Ø±ÙŠ\"' }\n    ];\n    const sev = { critical: ['var(--error-subtle)', 'var(--error)'], major: ['var(--warning-subtle)', 'var(--warning)'] };\n    const failures = bugData.map((b, i) => ({\n      ...b, open: s.bug === i,\n      toggle: () => this.set('bug', s.bug === i ? -1 : i),\n      caret: s.bug === i ? 'rotate(90deg)' : 'rotate(0deg)',\n      border: s.bug === i ? 'var(--border-strong)' : 'var(--border)',\n      sevBg: sev[b.severity][0], sevColor: sev[b.severity][1]\n    }));\n\n    const gaps = [\n      { id: 'REQ-021', title: 'Arabic invoice renders right-to-left', why: 'No UI test targets the invoice view; the API test only checks the payload.' },\n      { id: 'REQ-033', title: 'Audit log retained for 90 days', why: 'No endpoint exposing audit records was discovered — likely internal only.' }\n    ];\n\n    return {\n      navItems, pipeline, problemStats, layers, matrix, tiers,\n      discoveryModes, discoveryHint: hints[s.mode], rules, files, summary,\n      tabs, kpis, failures, gaps, url: s.url,\n      setUrl: (v) => this.set('url', typeof v === 'string' ? v : v && v.target ? v.target.value : ''),\n      isOverview: screen === 'overview', isNewRun: screen === 'newrun', isReport: screen === 'report',\n      tabFailures: s.tab === 'failures', tabMatrix: s.tab === 'matrix', tabGaps: s.tab === 'gaps',\n      goNewRun: () => this.set('screen', 'newrun'),\n      goReport: () => this.setState({ screen: 'report', tab: 'failures' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
