<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traceo — requirement → test → result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FORGE DESIGN SYSTEM — tokens
   ============================================================ */
:root{
  --bg:#131217; --surface:#1B1A21; --surface-2:#22212B; --surface-3:#2C2B37;
  --overlay:rgba(7,7,11,.66);
  --border:#312F3C; --border-strong:#443F54;
  --text:#F2EFF7; --text-secondary:#ADA8BB; --text-muted:#756F84; --text-inverse:#1A1207;

  --accent:#FF9B3D; --accent-press:#F08A2A; --accent-fill:#FF8A22; --accent-fill-press:#F07A12;
  --accent-fg:#211405; --accent-subtle:rgba(255,138,34,.16); --accent-ring:rgba(255,138,34,.42);

  --c-amber:#FF8A22; --c-coral:#FF5C72; --c-pink:#F85EC2; --c-violet:#9B6BFF;
  --c-blue:#4D9DFF; --c-cyan:#2BD4C4; --c-green:#4FD86B; --c-yellow:#FFC53D;

  --success:#3FD179; --success-subtle:rgba(63,209,121,.16);
  --warning:#FFC53D; --warning-subtle:rgba(255,197,61,.16);
  --error:#FF5C72;   --error-subtle:rgba(255,92,114,.16);
  --info:#4D9DFF;    --info-subtle:rgba(77,157,255,.16);

  --grad-warm:linear-gradient(135deg,#FF8A22 0%,#FF5C72 100%);
  --grad-cool:linear-gradient(135deg,#9B6BFF 0%,#4D9DFF 100%);
  --grad-hero:linear-gradient(135deg,#FF8A22 0%,#F85EC2 52%,#9B6BFF 100%);
  --grad-mint:linear-gradient(135deg,#2BD4C4 0%,#4FD86B 100%);

  --font-sans:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;
  --shadow-md:0 6px 18px rgba(0,0,0,.34); --shadow-lg:0 16px 40px rgba(0,0,0,.46);
  --dur:200ms; --ease:cubic-bezier(.2,.6,.2,1);
  --sidebar-w:248px; --topbar-h:60px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-sans);font-size:15px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
::selection{background:var(--accent-subtle)}
:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.hidden{display:none !important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r-sm);
  border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform 80ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent-fill);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-fill-press)}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--surface-3)}
.btn-ghost{background:transparent;color:var(--text-secondary)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.btn-lg{height:52px;padding:0 26px;font-size:15px}
.btn-block{width:100%}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1}

/* ---------- badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap}
.badge-success{background:var(--success-subtle);color:var(--success)}
.badge-warning{background:var(--warning-subtle);color:var(--warning)}
.badge-error{background:var(--error-subtle);color:var(--error)}
.badge-info{background:var(--info-subtle);color:var(--info)}
.badge-neutral{background:var(--surface-3);color:var(--text-secondary)}
.badge-accent{background:var(--accent-subtle);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-pill);border:1px solid var(--border);
  background:transparent;color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer;transition:all var(--dur) var(--ease)}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.on{background:var(--accent-subtle);border-color:var(--accent);color:var(--accent)}
.tag{display:inline-flex;padding:3px 9px;border-radius:var(--r-xs);background:var(--surface-3);color:var(--text-secondary);font-family:var(--font-mono);font-size:11px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;font-weight:500;color:var(--text-secondary)}
.input{height:46px;padding:0 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);font-family:var(--font-mono);font-size:13px;width:100%;transition:border-color var(--dur) var(--ease)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.input::placeholder{color:var(--text-muted)}
select.input{font-family:var(--font-sans);font-size:14px;cursor:pointer}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface-2);cursor:pointer;transition:all var(--dur) var(--ease);text-align:left}
.check.on{background:rgba(255,138,34,.06);border-color:var(--accent)}
.check .box{width:17px;height:17px;margin-top:2px;border-radius:5px;border:1.5px solid var(--border-strong);flex:none;
  display:grid;place-items:center;transition:all var(--dur) var(--ease)}
.check.on .box{background:var(--accent-fill);border-color:var(--accent-fill)}
.check .box svg{opacity:0;transition:opacity var(--dur) var(--ease)}
.check.on .box svg{opacity:1}
.check b{display:block;font-size:14px;font-weight:600}
.check span{display:block;font-size:12px;color:var(--text-muted)}
.switch{width:38px;height:22px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);
  position:relative;cursor:pointer;flex:none;transition:all var(--dur) var(--ease)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-muted);transition:all var(--dur) var(--ease)}
.switch.on{background:var(--accent-fill);border-color:var(--accent-fill)}
.switch.on::after{left:18px;background:var(--accent-fg)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:11px 16px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.tbl tbody tr{transition:background var(--dur) var(--ease)}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{font-family:var(--font-mono);font-size:13px}
.bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:90px;flex:1}
.bar>i{display:block;height:100%;border-radius:999px}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:11px;padding:0 18px;height:var(--topbar-h);border-bottom:1px solid var(--border);flex:none}
.logo{width:28px;height:28px;border-radius:8px;background:var(--grad-hero);display:grid;place-items:center;
  color:#1A1207;font-weight:700;font-size:14px;flex:none}
.sb-nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.sb-group{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--text-secondary);
  font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all var(--dur) var(--ease)}
.sb-item:hover{background:var(--surface-2);color:var(--text)}
.sb-item.on{background:var(--accent-subtle);color:var(--accent)}
.ic{width:16px;height:16px;flex:none}
.sb-item .ic{opacity:.9}
.sb-item .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.sb-foot{padding:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex:none}
.avatar{width:30px;height:30px;border-radius:var(--r-pill);background:var(--grad-cool);display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#0f0a1c;flex:none}

.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid var(--border);
  background:rgba(19,18,23,.86);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}
.topbar h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.crumb{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.content{padding:28px;max-width:1360px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.page-head h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.page-head p{font-size:14px;color:var(--text-secondary);margin-top:5px;max-width:640px}

/* ---------- layout helpers ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{height:1px;background:var(--border)}

/* ---------- KPI ---------- */
.kpi{padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-size:12px;color:var(--text-secondary);margin-top:4px}
.kpi .d{font-family:var(--font-mono);font-size:11px;margin-top:8px}

/* ---------- tabs ---------- */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.tab{border:none;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:600;padding:8px 16px;
  border-radius:8px;cursor:pointer;transition:all var(--dur) var(--ease)}
.tab:hover{color:var(--text)}
.tab.on{background:var(--surface-3);color:var(--text)}

/* ---------- accordion ---------- */
.acc{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);overflow:hidden;transition:border-color var(--dur) var(--ease)}
.acc.open{border-color:var(--border-strong)}
.acc-h{display:flex;align-items:center;gap:14px;padding:15px 20px;background:none;border:none;width:100%;cursor:pointer;text-align:left;color:var(--text)}
.acc-h .car{color:var(--text-muted);font-size:12px;transition:transform var(--dur) var(--ease)}
.acc.open .acc-h .car{transform:rotate(90deg)}
.acc-b{padding:0 20px 20px}
.codebox{padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);
  font-family:var(--font-mono);font-size:12px;line-height:1.7;color:var(--text-secondary);white-space:pre-wrap;overflow-x:auto}

/* ---------- misc ---------- */
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--r-md);padding:28px;text-align:center;background:var(--bg);
  cursor:pointer;transition:border-color var(--dur) var(--ease)}
.drop:hover{border-color:var(--accent)}
.empty{padding:48px 24px;text-align:center;color:var(--text-muted)}
.side-panel{position:fixed;top:0;right:0;bottom:0;width:520px;background:var(--surface);border-left:1px solid var(--border);
  z-index:60;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(0)}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:50}
.trend{display:flex;align-items:flex-end;gap:5px;height:96px}
.trend i{flex:1;border-radius:3px 3px 0 0;background:var(--grad-warm);opacity:.85;transition:opacity var(--dur) var(--ease)}
.trend i:hover{opacity:1}
.donut{--p:0;width:96px;height:96px;border-radius:50%;flex:none;
  background:conic-gradient(var(--accent-fill) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center}
.donut>span{width:70px;height:70px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-family:var(--font-mono);font-size:16px;font-weight:600}
.ref-id{font-family:var(--font-mono);font-size:11px;color:var(--accent);background:var(--accent-subtle);
  padding:2px 7px;border-radius:var(--r-xs)}

/* ---------- marketing ---------- */
.mk-header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:0 40px;height:68px;background:rgba(19,18,23,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.mk-nav{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px}
.mk-sec{padding:72px 40px;max-width:1240px;margin:0 auto}
.mk-alt{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.mk-h1{font-size:54px;line-height:1.06;letter-spacing:-.03em;font-weight:700;max-width:820px}
.mk-lede{font-size:18px;line-height:1.6;color:var(--text-secondary);max-width:700px}

@media (max-width:1100px){
  .g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .g5,.g4,.g3,.g2{grid-template-columns:1fr}
  .mk-h1{font-size:38px}
  .content{padding:20px}
}
</style>
</head>

<script>

/* ============================================================
   11 · FEATURE REFERENCE
   ============================================================ */
let refFilter = 'All';
function vReference(){
  const groups = [...new Set(DB.features.map(f => f.g))];
  const list = refFilter === 'All' ? DB.features : DB.features.filter(f => f.g === refFilter || f.pri === refFilter || f.st === refFilter);
  const shown = [...new Set(list.map(f => f.g))];
  const stats = [
    [DB.features.length,'Features documented'],
    [DB.features.filter(f => f.st==='Built').length,'Built'],
    [DB.features.filter(f => f.st==='Planned').length,'Planned'],
    [DB.features.filter(f => f.pri==='P0').length,'P0 — must ship'],
    [groups.length,'Capability groups']
  ];
  const chips = ['All', ...groups, 'P0','P1','P2','Built','Planned'];
  const body = `
  <div class="page-head">
    <div><h2>Feature reference</h2><p>Every capability in Traceo carries a stable reference ID. The same ID appears next to the feature in the interface, in the BRD, and in the acceptance criteria — so a conversation about <b class="mono">FR-035</b> means one thing everywhere.</p></div>
    <div class="row"><button class="btn btn-secondary btn-sm">Export CSV</button>
      <button class="btn btn-primary btn-sm">Download BRD</button></div>
  </div>

  <div class="grid g5">${stats.map(([v,l]) =>
    `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>

  <div class="row wrap" style="margin:20px 0 14px">
    ${chips.map(c => `<button class="chip ${refFilter===c?'on':''}" data-ref-filter="${c}">${c}</button>`).join('')}
  </div>

  ${shown.map(g => `
    <div style="margin-bottom:20px">
      <div class="row" style="margin-bottom:10px">
        <span class="eyebrow">${g}</span>
        <span class="sep grow"></span>
        <span class="crumb">${list.filter(f => f.g===g).length} features</span>
      </div>
      <div class="card" style="overflow:hidden">
        <table class="tbl">
          <thead><tr><th style="width:92px">Ref</th><th style="width:210px">Feature</th><th>Description</th>
            <th style="width:130px">Screen</th><th style="width:70px">Priority</th><th style="width:90px">Status</th></tr></thead>
          <tbody>${list.filter(f => f.g===g).map(f => `<tr>
            <td><span class="ref-id">${f.id}</span></td>
            <td><b style="font-size:14px">${esc(f.n)}</b></td>
            <td class="sec" style="font-size:13px">${esc(f.d)}</td>
            <td><span class="tag">${f.s}</span></td>
            <td><span class="badge ${f.pri==='P0'?'badge-error':f.pri==='P1'?'badge-warning':'badge-neutral'}">${f.pri}</span></td>
            <td>${f.st==='Built'?'<span class="badge badge-success">Built</span>':'<span class="badge badge-info">Planned</span>'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`).join('')}

  ${list.length===0?'<div class="empty">No features match this filter.</div>':''}`;
  return shell('reference','Feature reference','Docs / FR catalogue', body);
}

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  const hash = location.hash.replace(/^#\/?/, '') || 'overview';
  const parts = hash.split('/');
  const app = document.getElementById('app');
  let html;
  switch(parts[0]){
    case 'dashboard':    html = vDashboard(); break;
    case 'runs':         html = parts[1] ? vReport(parts[1]) : vRuns(); break;
    case 'new':          html = vNewRun(); break;
    case 'requirements': html = vRequirements(); break;
    case 'testcases':    html = vTestcases(); break;
    case 'api':          html = vApi(); break;
    case 'integrations': html = vIntegrations(); break;
    case 'settings':     html = vSettings(); break;
    case 'reference':    html = vReference(); break;
    default:             html = vOverview();
  }
  app.innerHTML = html;
  window.scrollTo(0,0);
}

document.addEventListener('click', e => {
  const accH = e.target.closest('[data-acc-h]');
  if (accH){
    const acc = accH.closest('[data-acc]');
    const open = acc.classList.toggle('open');
    const b = acc.querySelector('.acc-b');
    if (b) b.hidden = !open;
    return;
  }
  const tab = e.target.closest('[data-tab]');
  if (tab){ reportTab = tab.dataset.tab; render(); return; }

  const rf = e.target.closest('[data-ref-filter]');
  if (rf){ refFilter = rf.dataset.refFilter; render(); return; }

  const sw = e.target.closest('.switch');
  if (sw){ sw.classList.toggle('on'); return; }

  const chk = e.target.closest('.check');
  if (chk){ chk.classList.toggle('on'); return; }

  const chip = e.target.closest('.chip');
  if (chip && !chip.dataset.refFilter){
    const sibs = chip.parentElement.querySelectorAll('.chip');
    sibs.forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
  }
});

window.addEventListener('hashchange', render);
render();

</script>
