# Traceo — local / on-premise deployment (FR-081, BR-07).
#
# Two backends still exist (see docs/PLAN_2.0_CLOSEOUT_AR.md §2, decision A), so
# each sits behind a profile and you pick one. They both listen on 8000, so only
# one may run at a time:
#
#   docker compose --profile go up --build        # Go backend (recommended)
#   docker compose --profile python up --build    # Python backend
#
# Storage is a named volume, so data survives `up --build`. Nothing here opens an
# outbound connection: the mock LLM provider is the default (NFR-D1).
#
# PRODUCTION: `cp env.example .env` and set TRACEO_SECRET_KEY. Both backends
# refuse to start with TRACEO_ENV=production unless a unique key is set and demo
# seeding is off — that refusal is deliberate, not a bug.

name: traceo

services:
  backend-go:
    profiles: ["go"]
    build:
      context: ./backend-go
    image: traceo/backend-go:local
    environment:
      TRACEO_ENV: ${TRACEO_ENV:-development}
      TRACEO_SECRET_KEY: ${TRACEO_SECRET_KEY:-}
      TRACEO_SEED_DEMO: ${TRACEO_SEED_DEMO:-1}
      TRACEO_LLM_PROVIDER: ${TRACEO_LLM_PROVIDER:-mock}
      TRACEO_CORS_ORIGINS: ${TRACEO_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - traceo-data:/data
    restart: unless-stopped

  # The air-gapped backend: Go API + Node + Playwright + Chromium in one image,
  # every browser dependency baked in at build time (plan Decision B, NFR-D1).
  # Larger than backend-go by design — that image cannot scan a page at all.
  backend-airgapped:
    profiles: ["airgapped"]
    build:
      # Repository root, because the sidecar scripts live outside the Go module.
      context: .
      dockerfile: Dockerfile.airgapped
    image: traceo/airgapped:local
    environment:
      TRACEO_ENV: ${TRACEO_ENV:-development}
      TRACEO_SECRET_KEY: ${TRACEO_SECRET_KEY:-}
      TRACEO_SEED_DEMO: ${TRACEO_SEED_DEMO:-1}
      # mock keeps the container offline. Point TRACEO_LOCAL_LLM_BASE_URL at a
      # model server inside the perimeter and set TRACEO_LLM_PROVIDER=local to
      # get a real model without leaving it.
      TRACEO_LLM_PROVIDER: ${TRACEO_LLM_PROVIDER:-mock}
      TRACEO_LOCAL_LLM_BASE_URL: ${TRACEO_LOCAL_LLM_BASE_URL:-}
      TRACEO_LOCAL_LLM_MODEL: ${TRACEO_LOCAL_LLM_MODEL:-}
      TRACEO_CORS_ORIGINS: ${TRACEO_CORS_ORIGINS:-http://localhost:3000}
      # Loopback and private addresses are refused unless this is on; a local
      # application under test is exactly that.
      TRACEO_ALLOW_PRIVATE_TARGETS: ${TRACEO_ALLOW_PRIVATE_TARGETS:-0}
    ports:
      - "8000:8000"
    volumes:
      - traceo-data:/data
    # Chromium needs more than the default 64MB of /dev/shm or it crashes on a
    # heavy page — the classic headless-in-Docker failure.
    shm_size: "1gb"
    restart: unless-stopped

  backend-python:
    profiles: ["python"]
    build:
      context: ./backend
    image: traceo/backend-python:local
    environment:
      TRACEO_ENV: ${TRACEO_ENV:-development}
      TRACEO_SECRET_KEY: ${TRACEO_SECRET_KEY:-}
      TRACEO_SEED_DEMO: ${TRACEO_SEED_DEMO:-1}
      TRACEO_LLM_PROVIDER: ${TRACEO_LLM_PROVIDER:-mock}
      # Without these the container has no key, so TRACEO_LLM_PROVIDER=anthropic
      # or =gemini would silently degrade to the mock provider (NFR-REL-03) and
      # the stack would look configured while running offline.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRACEO_GEMINI_MODEL: ${TRACEO_GEMINI_MODEL:-gemini-3.5-flash}
      TRACEO_CORS_ORIGINS: ${TRACEO_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - traceo-data:/data
    restart: unless-stopped

  sut:
    # Demo system-under-test for the e2e suite (profile "e2e" so a production
    # `--profile go up` never ships it). Only the backend's run executor calls
    # it — over the compose network as http://sut:9000 — so no host port is
    # published. CI boots it with:
    #   docker compose --profile go --profile e2e up -d --wait
    # and the tests point the backend at it via SUT_URL=http://sut:9000.
    profiles: ["e2e"]
    build:
      context: ./demo/sut
    image: traceo/demo-sut:local
    restart: unless-stopped

  frontend:
    # No profile: pairs with whichever backend profile is active.
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — this is the URL the
        # BROWSER uses, so it is a host address, not a compose service name.
        NEXT_PUBLIC_API: ${NEXT_PUBLIC_API:-http://localhost:8000/v1}
    image: traceo/frontend:local
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  traceo-data:
