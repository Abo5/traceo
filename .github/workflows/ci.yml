# Traceo CI — every release gate must pass before merge.
#
# The gates are not ordinary unit tests: grounding (no fabricated endpoint may be
# persisted) and tenant isolation (no cross-organisation read) are the two
# guarantees the product is sold on, so a red build here blocks the merge.
#
# The image builds matter because Docker is not available on every developer
# machine — CI is where the deployment artefacts are actually proven to build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full regression at 02:00 UTC — fires the e2e job's schedule
    # branch (heavy @regression specs run here and on pushes to main only).
    - cron: "0 2 * * *"

concurrency:
  # event_name is part of the group so a nightly scheduled run is never
  # cancelled by (or cancels) a push to main that shares the same ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-python:
    name: Backend · Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Release gates (grounding · isolation · flow · integrations · config)
        working-directory: backend
        run: python -m pytest tests -q

  backend-go:
    name: Backend · Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend-go/go.sum
      - name: Formatting
        working-directory: backend-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        working-directory: backend-go
        run: go vet ./...
      - name: Release gates
        working-directory: backend-go
        # -race catches the execution engine's worker-pool and the scheduler
        # goroutine racing on shared run state.
        run: go test -race ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    name: Deployment images (FR-081)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Go backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-go
          push: false
          load: true
          tags: traceo/backend-go:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Python backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: traceo/backend-python:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: traceo/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Go image serves /health
        run: |
          docker run -d --name traceo-go -p 8000:8000 traceo/backend-go:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; ok=1; break; fi
            sleep 1
          done
          docker logs traceo-go
          docker rm -f traceo-go
          [ "$ok" = "1" ] || { echo "::error::Go image did not become healthy"; exit 1; }

      - name: Python image migrates a fresh database and serves
        # Proves docker-entrypoint.sh: db_adopt + `alembic upgrade head` must run
        # to completion before uvicorn binds, on a volume with no database yet.
        run: |
          docker run -d --name traceo-py -p 8001:8000 traceo/backend-python:ci
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8001/health; then echo; ok=1; break; fi
            sleep 1
          done
          docker logs traceo-py
          docker logs traceo-py 2>&1 | grep -q "schema up to date" \
            || { echo "::error::entrypoint did not report a migrated schema"; exit 1; }
          docker rm -f traceo-py
          [ "$ok" = "1" ] || { echo "::error::Python image did not become healthy"; exit 1; }

      - name: Production mode refuses the published dev secret
        # The guard is the reason an operator cannot accidentally ship a
        # forgeable signing key; if it ever stops refusing, that is a critical
        # regression and must fail the build.
        run: |
          if docker run --rm -e TRACEO_ENV=production traceo/backend-go:ci; then
            echo "::error::backend started in production mode without TRACEO_SECRET_KEY"
            exit 1
          fi
          echo "refused as expected"

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack (Go backend + frontend + demo SUT)
        # Same compose images the deployment ships (§17): mock LLM keeps the run
        # deterministic and offline; demo seeding is off — test data is created
        # through the API, never seeded. The "e2e" profile adds the demo SUT
        # (demo/sut) that run-executing specs point their Traceo environment at:
        # the RUN EXECUTOR inside the backend container is what calls it, so the
        # tests hand the backend a compose-internal address (SUT_URL below).
        run: docker compose --profile go --profile e2e up -d --wait
        env:
          TRACEO_LLM_PROVIDER: mock
          TRACEO_SEED_DEMO: "0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: PR fast lane
        # Fast subset per docs §12: smoke + critical path + light permission
        # checks + the a11y smoke. There is no @i18n lane any more — Traceo is
        # English-only, so there is no second language to run the smokes in.
        # --grep-invert "@regression" keeps the heavy specs out of the PR lane
        # even when they share a fast tag (e.g. the permission matrix is
        # "@permission @regression" and the full UI pipeline is "@e2e @regression").
        if: github.event_name == 'pull_request'
        working-directory: e2e
        run: npx playwright test --grep "@smoke|@critical|@permission|@a11y" --grep-invert "@regression"
        env:
          # Address the BACKEND's run executor uses to reach the demo SUT over
          # the compose network (e2e/config/resolve.ts; the browser never calls
          # it). Local host-based runs keep the localhost:9000 default.
          SUT_URL: http://sut:9000
      - name: Full run (main + nightly schedule)
        # No grep — everything runs, which is a strict superset of @regression:
        # covers @e2e @regression (full UI pipeline), @permission @regression
        # (role matrix), @negative @validation @regression, plus @a11y
        # alongside the fast-lane tags.
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        working-directory: e2e
        run: npx playwright test
        env:
          SUT_URL: http://sut:9000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e/reports
          retention-days: 14
